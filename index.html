<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placar Live Studio - Overlays de Futebol & Futsal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Montserrat:wght@400;600;800;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

    <!-- Firebase SDKs (v10 JS) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDemoKeyForPlacarLiveStudio2026",
            authDomain: "placar-live-studio.firebaseapp.com",
            projectId: "placar-live-studio",
            storageBucket: "placar-live-studio.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const matchDocRef = doc(db, "partidas", "jogo_ao_vivo");

        window.db = db;
        window.matchDocRef = matchDocRef;
        window.setDoc = setDoc;
        window.onSnapshot = onSnapshot;
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0d1117',
                            800: '#161b22',
                            700: '#21262d',
                            600: '#30363d',
                        },
                        brand: {
                            500: '#238636',
                            600: '#2ea043',
                            accent: '#58a6ff'
                        }
                    },
                    fontFamily: {
                        teko: ['Teko', 'sans-serif'],
                        montserrat: ['Montserrat', 'sans-serif'],
                        oswald: ['Oswald', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body.is-overlay {
            background-color: transparent !important;
            background: none !important;
            overflow: hidden;
        }

        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .animate-live {
            animation: pulse-red 1.5s infinite;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #161b22;
        }
        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-dark-900 text-gray-100 font-montserrat min-h-screen antialiased">

    <!-- BARRA NAVEGAÇÃO -->
    <nav id="appHeader" class="bg-dark-800 border-b border-dark-600 px-4 py-3 flex flex-wrap justify-between items-center gap-4 sticky top-0 z-50 shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-brand-500 text-white p-2 rounded-lg flex items-center justify-center font-bold text-xl">
                <i class="fa-solid fa-tv"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-wide text-white leading-none">Placar Live Studio</h1>
                <p class="text-xs text-gray-400">Sincronização Nuvem (Firebase Firestore)</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <div class="flex items-center gap-2 bg-dark-900 px-3 py-1.5 rounded-lg border border-dark-600 text-xs mr-2">
                <span id="syncStatusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="syncStatusText" class="text-emerald-400 font-bold">Nuvem Conectada</span>
            </div>

            <button onclick="setSportPreset('futsal')" class="bg-dark-700 hover:bg-dark-600 text-xs text-gray-200 px-3 py-1.5 rounded-lg border border-dark-600 flex items-center gap-1.5">
                <i class="fa-solid fa-futbol text-emerald-400"></i> Futsal
            </button>
            <button onclick="setSportPreset('futebol')" class="bg-dark-700 hover:bg-dark-600 text-xs text-gray-200 px-3 py-1.5 rounded-lg border border-dark-600 flex items-center gap-1.5">
                <i class="fa-solid fa-soccer-ball text-blue-400"></i> Futebol
            </button>
            <button onclick="copyOverlayUrl()" class="bg-brand-500 hover:bg-brand-600 text-white font-semibold text-xs px-3.5 py-1.5 rounded-lg shadow-lg flex items-center gap-2">
                <i class="fa-solid fa-link"></i> Copiar Link OBS
            </button>
        </div>
    </nav>

    <!-- PAINEL PRINCIPAL -->
    <div id="mainContainer" class="p-4 lg:p-6 max-w-[1600px] mx-auto">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- PRÉ-VISUALIZAÇÃO DO OVERLAY -->
            <div class="lg:col-span-12">
                <div class="bg-dark-800 rounded-xl border border-dark-600 p-4 shadow-xl">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs font-semibold uppercase text-gray-400 flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-red-500 animate-live"></span>
                            Pré-Visualização do Overlay
                        </span>
                        <span class="text-xs text-gray-400"><i class="fa-solid fa-eye"></i> Transparente no OBS Studio</span>
                    </div>

                    <div class="relative w-full h-[220px] md:h-[260px] bg-slate-950 rounded-lg border border-dark-700 flex items-center justify-center">
                        <div id="previewMount" class="w-full h-full relative flex items-center justify-center p-4"></div>
                    </div>
                </div>
            </div>

            <!-- CONTROLES -->
            <div class="lg:col-span-7 space-y-6">
                <div class="bg-dark-800 rounded-xl border border-dark-600 p-5 shadow-lg">
                    <h2 class="text-sm font-bold text-gray-300 uppercase mb-4 border-b border-dark-700 pb-2">Controle do Placar e Cronômetro</h2>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- TIME A -->
                        <div class="bg-dark-900/60 p-4 rounded-xl border border-dark-700">
                            <span class="text-xs font-bold text-gray-400 uppercase">Time A (Mandante)</span>
                            <h3 id="ctrlTeamAName" class="text-lg font-bold text-white truncate mb-2">Time A</h3>

                            <div class="my-4 flex items-center justify-center gap-3">
                                <button onclick="updateScore('A', -1)" class="w-10 h-12 bg-dark-700 hover:bg-dark-600 text-white rounded-lg font-bold text-xl">-</button>
                                <span id="ctrlScoreA" class="text-5xl font-black text-white font-teko min-w-[60px] text-center bg-dark-800 py-1 px-3 rounded-lg border border-dark-600">0</span>
                                <button onclick="updateScore('A', 1)" class="w-12 h-12 bg-brand-500 hover:bg-brand-600 text-white rounded-lg font-bold text-2xl">+1</button>
                            </div>

                            <div class="flex items-center justify-between border-t border-dark-700/50 pt-2">
                                <span class="text-xs text-gray-400">Faltas:</span>
                                <div class="flex items-center gap-1.5">
                                    <button onclick="updateFouls('A', -1)" class="w-6 h-6 bg-dark-700 text-xs text-gray-300 rounded">-</button>
                                    <span id="ctrlFoulsA" class="text-sm font-bold text-amber-400 min-w-[20px] text-center">0</span>
                                    <button onclick="updateFouls('A', 1)" class="w-6 h-6 bg-dark-700 text-xs text-gray-300 rounded">+</button>
                                </div>
                            </div>
                        </div>

                        <!-- TIME B -->
                        <div class="bg-dark-900/60 p-4 rounded-xl border border-dark-700">
                            <span class="text-xs font-bold text-gray-400 uppercase">Time B (Visitante)</span>
                            <h3 id="ctrlTeamBName" class="text-lg font-bold text-white truncate mb-2">Time B</h3>

                            <div class="my-4 flex items-center justify-center gap-3">
                                <button onclick="updateScore('B', -1)" class="w-10 h-12 bg-dark-700 hover:bg-dark-600 text-white rounded-lg font-bold text-xl">-</button>
                                <span id="ctrlScoreB" class="text-5xl font-black text-white font-teko min-w-[60px] text-center bg-dark-800 py-1 px-3 rounded-lg border border-dark-600">0</span>
                                <button onclick="updateScore('B', 1)" class="w-12 h-12 bg-brand-500 hover:bg-brand-600 text-white rounded-lg font-bold text-2xl">+1</button>
                            </div>

                            <div class="flex items-center justify-between border-t border-dark-700/50 pt-2">
                                <span class="text-xs text-gray-400">Faltas:</span>
                                <div class="flex items-center gap-1.5">
                                    <button onclick="updateFouls('B', -1)" class="w-6 h-6 bg-dark-700 text-xs text-gray-300 rounded">-</button>
                                    <span id="ctrlFoulsB" class="text-sm font-bold text-amber-400 min-w-[20px] text-center">0</span>
                                    <button onclick="updateFouls('B', 1)" class="w-6 h-6 bg-dark-700 text-xs text-gray-300 rounded">+</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- CRONÔMETRO -->
                    <div class="mt-6 p-4 bg-dark-900 rounded-xl border border-dark-700">
                        <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
                            <div>
                                <span class="text-xs text-gray-400 block mb-1">Etapa</span>
                                <select id="ctrlPeriod" onchange="updatePeriod(this.value)" class="bg-dark-800 border border-dark-600 text-white text-xs rounded-lg p-2">
                                    <option value="1º TEMPO">1º Tempo</option>
                                    <option value="INTERVALO">Intervalo</option>
                                    <option value="2º TEMPO">2º Tempo</option>
                                    <option value="PRORROGAÇÃO">Prorrogação</option>
                                    <option value="FINAL">Fim de Jogo</option>
                                </select>
                            </div>

                            <div class="text-center">
                                <div id="ctrlTimerDisplay" class="font-teko text-4xl font-bold text-emerald-400 bg-black/40 px-4 py-0.5 rounded border border-dark-700">
                                    00:00
                                </div>
                            </div>

                            <div class="flex items-center gap-2">
                                <button id="ctrlTimerStartBtn" onclick="toggleTimer()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-lg text-sm">
                                    <i class="fa-solid fa-play"></i> Iniciar
                                </button>
                                <button onclick="resetTimer()" class="bg-dark-700 text-gray-200 px-3 py-2 rounded-lg text-sm border border-dark-600">
                                    <i class="fa-solid fa-rotate-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CONFIGURAÇÕES DOS TIMES -->
            <div class="lg:col-span-5 space-y-6">
                <div class="bg-dark-800 rounded-xl border border-dark-600 p-5 shadow-lg">
                    <h2 class="text-sm font-bold text-gray-300 uppercase mb-4 border-b border-dark-700 pb-2">Edição de Times</h2>

                    <div class="space-y-3 mb-4">
                        <label class="text-xs text-gray-400 block">Time A</label>
                        <input type="text" id="inpTeamAName" oninput="saveSettings()" class="w-full bg-dark-900 border border-dark-600 rounded-lg p-2 text-sm text-white">
                        <input type="color" id="inpTeamAColor" onchange="saveSettings()" class="w-full h-8 bg-transparent cursor-pointer">
                    </div>

                    <div class="space-y-3">
                        <label class="text-xs text-gray-400 block">Time B</label>
                        <input type="text" id="inpTeamBName" oninput="saveSettings()" class="w-full bg-dark-900 border border-dark-600 rounded-lg p-2 text-sm text-white">
                        <input type="color" id="inpTeamBColor" onchange="saveSettings()" class="w-full h-8 bg-transparent cursor-pointer">
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- CONTAINER OVERLAY OBS -->
    <div id="standaloneOverlayContainer" class="hidden"></div>

    <script>
        window.defaultState = {
            teamA: { name: 'FLAMENGO', score: 0, fouls: 0, color: '#cc0000', textColor: '#ffffff' },
            teamB: { name: 'PALMEIRAS', score: 0, fouls: 0, color: '#006437', textColor: '#ffffff' },
            timer: { seconds: 0, running: false, period: '1º TEMPO' },
            settings: { style: 'tv-modern', scale: 1, showFouls: true, showTimer: true, showPeriod: true }
        };

        window.appState = { ...window.defaultState };
        window.timerInterval = null;

        const urlParams = new URLSearchParams(window.location.search);
        window.isOverlayMode = urlParams.get('mode') === 'overlay';

        window.addEventListener('DOMContentLoaded', () => {
            if (window.isOverlayMode) {
                document.body.classList.add('is-overlay');
                document.getElementById('appHeader').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'none';
                const overlayContainer = document.getElementById('standaloneOverlayContainer');
                overlayContainer.classList.remove('hidden');
                overlayContainer.classList.add('w-screen', 'h-screen', 'flex', 'items-start', 'justify-start', 'p-6');
            }

            // Escutador em Tempo Real do Firebase (Sempre Ativo)
            const checkFirebase = setInterval(() => {
                if (window.onSnapshot && window.matchDocRef) {
                    clearInterval(checkFirebase);
                    window.onSnapshot(window.matchDocRef, (snapshot) => {
                        if (snapshot.exists()) {
                            window.appState = snapshot.data();
                            updateUI();
                        } else {
                            saveToFirebase();
                        }
                    });
                }
            }, 100);

            startTimerLoop();
        });

        function saveToFirebase() {
            if (window.setDoc && window.matchDocRef) {
                window.setDoc(window.matchDocRef, window.appState);
            }
        }

        function updateUI() {
            if (!window.isOverlayMode) {
                document.getElementById('ctrlTeamAName').innerText = window.appState.teamA.name;
                document.getElementById('ctrlScoreA').innerText = window.appState.teamA.score;
                document.getElementById('ctrlFoulsA').innerText = window.appState.teamA.fouls;

                document.getElementById('ctrlTeamBName').innerText = window.appState.teamB.name;
                document.getElementById('ctrlScoreB').innerText = window.appState.teamB.score;
                document.getElementById('ctrlFoulsB').innerText = window.appState.teamB.fouls;

                document.getElementById('ctrlTimerDisplay').innerText = formatTime(window.appState.timer.seconds);
                document.getElementById('inpTeamAName').value = window.appState.teamA.name;
                document.getElementById('inpTeamAColor').value = window.appState.teamA.color;
                document.getElementById('inpTeamBName').value = window.appState.teamB.name;
                document.getElementById('inpTeamBColor').value = window.appState.teamB.color;
                
                renderOverlay(document.getElementById('previewMount'));
            } else {
                renderOverlay(document.getElementById('standaloneOverlayContainer'));
            }
        }

        window.updateScore = function(team, delta) {
            if (team === 'A') window.appState.teamA.score = Math.max(0, window.appState.teamA.score + delta);
            else window.appState.teamB.score = Math.max(0, window.appState.teamB.score + delta);
            saveToFirebase();
        };

        window.updateFouls = function(team, delta) {
            if (team === 'A') window.appState.teamA.fouls = Math.max(0, window.appState.teamA.fouls + delta);
            else window.appState.teamB.fouls = Math.max(0, window.appState.teamB.fouls + delta);
            saveToFirebase();
        };

        window.toggleTimer = function() {
            window.appState.timer.running = !window.appState.timer.running;
            saveToFirebase();
        };

        window.resetTimer = function() {
            window.appState.timer.seconds = 0;
            window.appState.timer.running = false;
            saveToFirebase();
        };

        function startTimerLoop() {
            setInterval(() => {
                if (window.appState.timer.running) {
                    window.appState.timer.seconds++;
                    if (!window.isOverlayMode) {
                        document.getElementById('ctrlTimerDisplay').innerText = formatTime(window.appState.timer.seconds);
                    }
                    // Atualiza a nuvem a cada 5 segundos para não sobrecarregar
                    if (window.appState.timer.seconds % 5 === 0) saveToFirebase();
                }
            }, 1000);
        }

        window.saveSettings = function() {
            window.appState.teamA.name = document.getElementById('inpTeamAName').value.toUpperCase();
            window.appState.teamA.color = document.getElementById('inpTeamAColor').value;
            window.appState.teamB.name = document.getElementById('inpTeamBName').value.toUpperCase();
            window.appState.teamB.color = document.getElementById('inpTeamBColor').value;
            saveToFirebase();
        };

        function formatTime(totalSeconds) {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        window.copyOverlayUrl = function() {
            const overlayUrl = window.location.href.split('?')[0] + '?mode=overlay';
            navigator.clipboard.writeText(overlayUrl);
            alert('URL copiada!\nCole no OBS em Fonte de Navegador:\n' + overlayUrl);
        };

        function renderOverlay(targetElement) {
            if (!targetElement) return;
            targetElement.innerHTML = `
                <div class="flex items-center bg-gray-950 text-white rounded-lg overflow-hidden border border-white/10 shadow-2xl">
                    <div class="px-4 py-2 font-bold" style="background-color: ${window.appState.teamA.color}">
                        ${window.appState.teamA.name}
                    </div>
                    <div class="px-3 py-2 font-teko text-2xl font-black bg-black">${window.appState.teamA.score}</div>
                    <div class="px-3 py-2 font-teko text-2xl font-black bg-black">${window.appState.teamB.score}</div>
                    <div class="px-4 py-2 font-bold" style="background-color: ${window.appState.teamB.color}">
                        ${window.appState.teamB.name}
                    </div>
                    <div class="px-3 py-2 bg-zinc-900 font-teko text-xl text-emerald-400">
                        ${formatTime(window.appState.timer.seconds)}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
